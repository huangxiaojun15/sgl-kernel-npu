name: Build and Release SGL-Kernel-NPU

on:
  release:
    types:
      - published

  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/build_and_release.yml'
      - 'config.ini'
      - 'build.sh'

jobs:

  build-and-release:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, 950]
        cann_version: [9.1.0, 9.2.0]
        torch_version: [2.10.0]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version == '9.2.0' && '9.2.0-beta.1' || matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      # 只在这个 job 打这个补丁：csrc 里同时包含 CANN 的 tiling 头和 torch_npu 的头，
      # 两边都定义 ge::GRAPH_* 常量会报 redefinition（CANN 9.2.0 把常量搬到了
      # graph/error_codes.h）。cann-custom 的 torch_ops_extension 构建没有 CANN 的
      # include 根目录，在那边打这个补丁反而会找不到头，所以不放在 install 脚本里。
      - name: Patch torch_npu ACL header for CANN 9.2.0
        if: matrix.cann_version == '9.2.0'
        run: |
          # 注意：这里不要 import torch_npu —— 本 step 是非登录 shell，CANN 运行时库
          # (libascend_hal.so) 不在 LD_LIBRARY_PATH 上，import 会直接失败。只按路径找。
          torch_npu_root="$(python3 -c 'import os, sys; print(next((os.path.join(d, "torch_npu") for d in sys.path if os.path.isdir(os.path.join(d, "torch_npu", "include"))), ""))')"
          if [ -z "${torch_npu_root}" ]; then
            echo "ERROR: torch_npu package dir not found" >&2
            exit 1
          fi
          stale_header="${torch_npu_root}/include/third_party/acl/inc/graph/ge_error_codes.h"
          if [ ! -f "${stale_header}" ]; then
            echo "ERROR: ${stale_header} not found" >&2
            exit 1
          fi
          cp -n "${stale_header}" "${stale_header}.torch-npu.orig"
          # 1) 删掉与 CANN graph/error_codes.h 重复的 GRAPH_* 常量定义
          sed -i -E '/^[[:space:]]*const[[:space:]]+graphStatus[[:space:]]+GRAPH_[A-Za-z0-9_]+[[:space:]]*=/d' "${stale_header}"
          # 2) 让旧头引用 CANN 的新头；优先用绝对路径，避免依赖 -I
          #    注意不能整份拷 CANN 的同名头 —— 那个文件内部是相对路径 include "error_codes.h"
          cann_root="${ASCEND_HOME_PATH:-}"
          [ -d "${cann_root}" ] || cann_root=/usr/local/Ascend
          cann_header=""
          if [ -d "${cann_root}" ]; then
            cann_header="$(find "${cann_root}" -path "*/graph/error_codes.h" 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "${cann_header}" ]; then
            sed -i "1i #include \"${cann_header}\"" "${stale_header}"
          else
            sed -i '1i #include <graph/error_codes.h>' "${stale_header}"
          fi
          echo "INFO: patched ${stale_header} (include: ${cann_header:-<graph/error_codes.h>}, remaining duplicate consts: $(grep -c -E 'const[[:space:]]+graphStatus[[:space:]]+GRAPH_' "${stale_header}" || true))"
          sed -n '1,3p' "${stale_header}"

      - name: Build SGL-Kernel-NPU for a3
        if: matrix.npu_hardware == 'a3'
        run: |
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a kernels
          "

      - name: Build SGL-Kernel-NPU for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a kernels Ascend950PR_9599
          "

      - name: Build Attentions
        run: |
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a attentions
          "

      - name: Build Torch-Memory-Saver
        run: |
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a memory-saver
          "

      - name: Build DeepEP for a3
        if: matrix.npu_hardware == 'a3'
        run: |
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a deepep
          "

      - name: Build DeepEP for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a deepep Ascend950
          "
      - name: Pack up packages
        run: |
          export TORCH_DEVICE_BACKEND_AUTOLOAD=0
          TORCH_VERSION=$(python3 -c "import torch; print(torch.__version__)" | awk -F'+' '{print $1}')
          PYTHON_VERSION=$(python3 -c "import platform; print(platform.python_version())" | awk -F'.' '{print $1$2}')
          PACKAGE_NAME="sgl-kernel-npu-${{ github.event.release.tag_name }}-torch${TORCH_VERSION}-py${PYTHON_VERSION}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd output/
          zip -v ${PACKAGE_NAME} ./*.whl
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./output/*.zip

  build-ops-transformer:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, aarch64 ]
        npu_hardware: [ a3, 950 ]
        cann_version: [ 9.1.0, 9.2.0 ]
        torch_version: [ 2.10.0 ]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version == '9.2.0' && '9.2.0-beta.1' || matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Debug tag info
        if: github.event_name == 'release'
        run: |
          echo "github.ref = ${{ github.ref }}"
          echo "tag from release event = ${{ github.event.release.tag_name }}"

      - name: Build ops-transformer for a3
        if: matrix.npu_hardware == 'a3'
        run: |
          cd ../
          git clone https://gitcode.com/cann/ops-transformer.git
          cd ops-transformer
          # 9.2.0 必须用配套分支：它 pin 的 opbase 才和 CANN 9.2.0 的头文件一致
          # （旧 pin 的 opbase 会让 ElewiseBaseTiling 的 const 声明对不上），
          # 而且它的代码按新 opbase 的日志接口适配过（只换 opbase 会报 'OP' 未声明）
          if [ "${{ matrix.cann_version }}" = "9.2.0" ]; then
            git checkout 9.2.0-beta.1
          else
            git checkout bcc6304
          fi
          env -i PATH=${PATH} bash --login -c "
            pip install packaging
            bash build.sh --pkg --experimental --soc=ascend910_93 --ops=\"sparse_attn_sharedkv,sparse_attn_sharedkv_metadata,quant_lightning_indexer,quant_lightning_indexer_metadata,compressor\"
          "

      - name: Build ops-transformer for 950
        if: matrix.npu_hardware == '950'
        run: |
          cd ../
          git clone https://gitcode.com/cann/ops-transformer.git
          cd ops-transformer
          # 同上：9.2.0 走配套分支
          if [ "${{ matrix.cann_version }}" = "9.2.0" ]; then
            git checkout 9.2.0-beta.1
          else
            git checkout bcc6304
          fi
          env -i PATH=${PATH} bash --login -c "
            pip install packaging
            bash build.sh --pkg --experimental --soc=ascend950 --ops=\"quant_lightning_indexer,quant_lightning_indexer_metadata,compressor,kv_quant_sparse_attn_sharedkv,kv_quant_sparse_attn_sharedkv_metadata,kv-compressor_epilog,hc_post,inplace_partial_rotary_mul,indexer_compress_epilog,moe_gating_top_k\"
          "

      - name: Pack up packages
        run: |
          PACKAGE_NAME="ops-transformer-${{ github.event.release.tag_name }}-torch${{ matrix.torch_version }}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd ../ops-transformer/build_out
          zip -v ${PACKAGE_NAME} ./*.run
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ../ops-transformer/build_out/*.zip

  build-cuntom-ops:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, aarch64 ]
        npu_hardware: [ a3, 950 ]
        cann_version: [ 9.1.0, 9.2.0 ]
        torch_version: [ 2.10.0 ]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version == '9.2.0' && '9.2.0-beta.1' || matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Debug tag info
        if: github.event_name == 'release'
        run: |
          echo "github.ref = ${{ github.ref }}"
          echo "tag from release event = ${{ github.event.release.tag_name }}"

      - name: Build cann-custom for a3
        if: matrix.npu_hardware == 'a3'
        run: |
          cd ../
          git clone https://gitcode.com/cann/cann-recipes-infer.git
          cd cann-recipes-infer
          git checkout 35a476c
          # CANN 9.2.0 的 ascendc_impl_build.py 会给 string 属性默认值多套一层引号，生成的
          # impl .py 里出现 quant_mode=""static"" 这种非法 Python，opc 解析直接 SyntaxError。
          # 做法：写一个修正脚本，挂在 generate_adapt_py 之后调用它。
          # 注意别把带引号/括号的 sed 命令直接写进 CMake —— CMake 生成 makefile 时不会加
          # 引号，make 交给 /bin/sh 会报 Syntax error: "(" unexpected。
          if [ "${{ matrix.cann_version }}" = "9.2.0" ]; then
            cat > ops/ascendc/fix_impl_py_quotes.sh <<'SH'
          #!/usr/bin/env bash
          # 把 opc 生成文件里 ...=""xxx"" 还原成 ...="xxx"
          set -euo pipefail
          target_dir="$1"
          if [ ! -d "$target_dir" ]; then
            echo "WARN: $target_dir not found, skip" >&2
            exit 0
          fi
          find "$target_dir" -name '*.py' -print0 | xargs -0 -r sed -i -E 's/=""([^"]*)""/="\1"/g'
          SH
            chmod +x ops/ascendc/fix_impl_py_quotes.sh
            sed -i '/--opsinfo-dir ${base_aclnn_binary_dir}/a\        COMMAND bash ${CMAKE_CURRENT_SOURCE_DIR}/fix_impl_py_quotes.sh ${ASCEND_IMPL_OUT_DIR}/dynamic' ops/ascendc/CMakeLists.txt
            grep -n "fix_impl_py_quotes" ops/ascendc/CMakeLists.txt
          fi
          env -i PATH=${PATH} bash --login -c "
            cd ops/ascendc/torch_ops_extension
            pip install ninja
            bash build_and_install.sh
          "
          env -i PATH=${PATH} bash --login -c "
            cd ops/ascendc
            bash build.sh -c \"ascend910_93\"
          "

      - name: Build cann-custom for 950
        if: matrix.npu_hardware == '950'
        run: |
          cd ../
          git clone https://gitcode.com/cann/cann-recipes-infer.git
          cd cann-recipes-infer
          git checkout 35a476c
          # 同上：9.2.0 需要修正 opc 生成的 impl .py 里的重复引号
          if [ "${{ matrix.cann_version }}" = "9.2.0" ]; then
            cat > ops/ascendc/fix_impl_py_quotes.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          target_dir="$1"
          if [ ! -d "$target_dir" ]; then
            echo "WARN: $target_dir not found, skip" >&2
            exit 0
          fi
          find "$target_dir" -name '*.py' -print0 | xargs -0 -r sed -i -E 's/=""([^"]*)""/="\1"/g'
          SH
            chmod +x ops/ascendc/fix_impl_py_quotes.sh
            sed -i '/--opsinfo-dir ${base_aclnn_binary_dir}/a\        COMMAND bash ${CMAKE_CURRENT_SOURCE_DIR}/fix_impl_py_quotes.sh ${ASCEND_IMPL_OUT_DIR}/dynamic' ops/ascendc/CMakeLists.txt
          fi
          env -i PATH=${PATH} bash --login -c "
            cd ops/ascendc/torch_ops_extension
            pip install ninja
            bash build_and_install.sh
          "
          env -i PATH=${PATH} bash --login -c "
            cd ops/ascendc
            bash build.sh -c \"ascend950\"
          "

      - name: Pack up packages
        run: |
          PACKAGE_NAME="custom-ops-${{ github.event.release.tag_name }}-torch${{ matrix.torch_version }}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd ../cann-recipes-infer
          mkdir output
          cp ./ops/ascendc/torch_ops_extension/dist/custom_ops-*.whl ./output
          cp ./ops/ascendc/output/CANN-custom_ops-*.run ./output
          cd output
          zip -v ${PACKAGE_NAME} ./*.run ./*.whl
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ../cann-recipes-infer/output/*.zip