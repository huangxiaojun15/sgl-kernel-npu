name: Build and Release SGL-Kernel-NPU

on:
  release:
    types:
      - published

  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build_and_release.yml
      - config.ini
      - build.sh

jobs:
  build-kernels:
    name: Kernels / ${{ matrix.arch }} / ${{ matrix.npu_hardware }} / CANN ${{ matrix.cann_version }}
    timeout-minutes: 480
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, "950"]
        cann_version: ["9.1.0", "9.2.0"]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh \
            --cann-version "${{ matrix.cann_version }}"

      - name: Build SGL-Kernel-NPU for a3
        if: matrix.npu_hardware != '950'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH}:${ASCEND_HOME_PATH}/\$(arch)-linux/devlib &&
            python3 setup.py --arch-version 2201 --ops all --artifact wheel -j 8
          "

      - name: Build SGL-Kernel-NPU for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH}:${ASCEND_HOME_PATH}/\$(arch)-linux/devlib &&
            python3 setup.py --arch-version 3510 --ops all --artifact wheel -j 2
          "

      - name: Publish kernel wheels
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: output/*.whl
          fail_on_unmatched_files: true

  build-attentions:
    name: Attentions / ${{ matrix.arch }} / ${{ matrix.npu_hardware }} / CANN ${{ matrix.cann_version }}
    timeout-minutes: 480
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, "950"]
        cann_version: ["9.1.0", "9.2.0"]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh \
            --cann-version "${{ matrix.cann_version }}"

      - name: Build Attentions
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a attentions
          "

      - name: Publish Attentions wheels
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: output/*.whl
          fail_on_unmatched_files: true

  build-memory-saver:
    name: Torch-Memory-Saver / ${{ matrix.arch }} / ${{ matrix.npu_hardware }} / CANN ${{ matrix.cann_version }}
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, "950"]
        cann_version: ["9.1.0", "9.2.0"]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh \
            --cann-version "${{ matrix.cann_version }}"

      - name: Build Torch-Memory-Saver
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a memory-saver
          "

      - name: Publish Torch-Memory-Saver wheels
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: output/*.whl
          fail_on_unmatched_files: true

  build-deepep:
    name: DeepEP / ${{ matrix.arch }} / ${{ matrix.npu_hardware }} / CANN ${{ matrix.cann_version }}
    timeout-minutes: 480
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, "950"]
        cann_version: ["9.1.0", "9.2.0"]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    container:
      image: quay.io/ascend/cann:${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh \
            --cann-version "${{ matrix.cann_version }}"

      - name: Build DeepEP for a3
        if: matrix.npu_hardware == 'a3'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a deepep
          "

      - name: Build DeepEP for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i PATH="${PATH}" bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} &&
            ./build.sh -a deepep Ascend950
          "

      - name: Publish DeepEP wheels
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: output/*.whl
          fail_on_unmatched_files: true
