name: Build and Release SGL-Kernel-NPU

on:
  release:
    types:
      - published

  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build_and_release.yml
      - config.ini
      - build.sh
jobs:
  build-kernels:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, "950"]
        cann_version: ["9.1.0", "9.2.0"]
    # checkout / install / build
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: output/*.whl
          if-no-files-found: error
          compression-level: 0

  build-deepep:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        npu_hardware: [a3, "950"]
        cann_version: ["9.1.0", "9.2.0"]
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: deepep-${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: output/*.whl
          if-no-files-found: error

  build-attentions:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        cann_version: ["9.1.0", "9.2.0"]
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: attentions-${{ matrix.cann_version }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: output/*.whl
          if-no-files-found: error

  build-memory-saver:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        cann_version: ["9.1.0", "9.2.0"]
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: memory-saver-${{ matrix.cann_version }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: output/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs:
      - build-kernels
      - build-deepep
      - build-attentions
      - build-memory-saver
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ github.run_attempt }}"
          path: release
          merge-multiple: false

      - name: Check wheel filename collisions
        run: |
          find release -type f -name '*.whl' -printf '%f\n' | sort | uniq -d | tee duplicates.txt
          test ! -s duplicates.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
