name: Build and Release SGL-Kernel-NPU

on:
  release:
    types:
      - published

  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/build_and_release.yml'
      - 'config.ini'
      - 'build.sh'
jobs:

  build-and-release:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [aarch64]
        npu_hardware: [950]
        cann_version: [9.3.0]
        torch_version: [2.12.0]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-north-4.myhuaweicloud.com/sglang/cann9.3.0-openeuler24.03:20261009-py312
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}


      - name: Build SGL-Kernel-NPU for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a kernels Ascend950PR_9599
          "

      - name: Build Attentions
        run: |
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a attentions
          "

      - name: Build Torch-Memory-Saver
        run: |
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a memory-saver
          "


      - name: Build DeepEP for 950
        if: matrix.npu_hardware == '950'
        run: |
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a deepep Ascend950
          "
      - name: Pack up packages
        run: |
          export TORCH_DEVICE_BACKEND_AUTOLOAD=0
          TORCH_VERSION=$(python3 -c "import torch; print(torch.__version__)" | awk -F'+' '{print $1}')
          PYTHON_VERSION=$(python3 -c "import platform; print(platform.python_version())" | awk -F'.' '{print $1$2}')
          PACKAGE_NAME="sgl-kernel-npu-${{ github.event.release.tag_name }}-torch${TORCH_VERSION}-py${PYTHON_VERSION}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd output/
          zip -v ${PACKAGE_NAME} ./*.whl
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./output/*.zip

  build-ops-transformer:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [ aarch64 ]
        npu_hardware: [ 950 ]

        cann_version: [ 9.3.0 ]
        torch_version: [ 2.12.0 ]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-north-4.myhuaweicloud.com/sglang/cann9.3.0-openeuler24.03:20261009-py312

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Debug tag info
        if: github.event_name == 'release'
        run: |
          echo "github.ref = ${{ github.ref }}"
          echo "tag from release event = ${{ github.event.release.tag_name }}"


      - name: Build ops-transformer for 950
        if: matrix.npu_hardware == '950'
        run: |
          cd ../
          git clone https://gitcode.com/cann/ops-transformer.git
          cd ops-transformer
          git checkout bcc6304
          # <改> 保留 bcc6304，补上 CANN 9.3.0 兼容修复（照搬上游 f51d44c84 + master）：
          #   1) FindOPBASE.cmake 加 NO_DEFAULT_PATH。
          #      关键点：find_path 的默认搜索路径排在 PATHS 前面，所以光调 include
          #      顺序没用——它会先把 OPBASE_INC_DIR 定到 CANN 包里的
          #      aarch64-linux/include（FindOPBASE 打印的 "Found OPABSE include:"
          #      就是它），opbase 自己的源码于是被 CANN 9.3.0 的头编译，报
          #      AdaptEleBaseTilingData / GetScheMode / GetBlockDim
          #      "no declaration matches"（CANN 头里是 const）和
          #      'WORKSPACE_SIZE' was not declared（它只定义在 opbase 自己的
          #      pkg_inc/op_common/atvoss/reduce/reduce_tiling.h 里）。
          #      加 NO_DEFAULT_PATH 后 OPBASE_INC_DIR 落到 third_party/opbase/include，
          #      opbase 的头和源码就是同一个版本的。
          #   2) variables.cmake 把 ${OPBASE_INC_DIRS} 提到各 include 列表最前（f51d44c84）。
          #   3) ops_err.h 里 OpLogSub(OP, ...) 的 OP 在 CANN 9.3.0 的 log.h 里已经
          #      没有了，换成模块号常量（上游 master 的写法）。
          python3 - <<'PY'
          def patch(path, old, new):
              s = open(path, encoding="utf-8").read()
              assert s.count(old) == 1, (path, old[:40])
              open(path, "w", encoding="utf-8").write(s.replace(old, new, 1))

          p = "cmake/modules/FindOPBASE.cmake"
          patch(p, "  PATHS ${OPBASE_HEAD_SEARCH_PATHS}\n  NO_CMAKE_SYSTEM_PATH\n",
                   "  PATHS ${OPBASE_HEAD_SEARCH_PATHS}\n  NO_DEFAULT_PATH\n  NO_CMAKE_SYSTEM_PATH\n")
          patch(p, "  set(OPBASE_INC_DIRS\n",
                   "  set(OPBASE_INC_DIRS\n"
                   "    ${OPBASE_SOURCE_PATH}/pkg_inc/op_common\n"
                   "    ${OPBASE_SOURCE_PATH}/include/op_common\n"
                   "    ${OPBASE_SOURCE_PATH}/pkg_inc/op_common/op_host\n"
                   "    ${OPBASE_SOURCE_PATH}/include/op_common/op_host\n"
                   "    ${OPBASE_SOURCE_PATH}/include/op_common/atvoss\n")

          s = open("cmake/variables.cmake", encoding="utf-8").read()
          for name in ("OPAPI_INCLUDE", "OP_TILING_INCLUDE", "OP_PROTO_INCLUDE"):
              head = f"set({name}\n"
              start = s.index(head) + len(head)
              end = s.index("\n)\n", start)
              body = "\n".join(l for l in s[start:end].split("\n") if "${OPBASE_INC_DIRS}" not in l)
              s = s[:start] + "  ${OPBASE_INC_DIRS}\n" + body + s[end:]
          open("cmake/variables.cmake", "w", encoding="utf-8").write(s)

          p = "common/include/err/ops_err.h"
          patch(p, '#include "log/log.h"\n',
                   '#include "log/log.h"\n\nconstexpr int32_t OP_TRANSFORMER_MODULE_ID = 63;\n')
          patch(p, "OpLogSub(OP, DLOG_ERROR", "OpLogSub(OP_TRANSFORMER_MODULE_ID, DLOG_ERROR")
          print("ops-transformer CANN 9.3.0 兼容补丁已应用")
          PY
          grep -n NO_DEFAULT_PATH cmake/modules/FindOPBASE.cmake
          grep -n OP_TRANSFORMER_MODULE_ID common/include/err/ops_err.h
          env -i PATH=${PATH} bash --login -c "
            pip install packaging
            bash build.sh --pkg --experimental --soc=ascend950 --ops=\"quant_lightning_indexer,quant_lightning_indexer_metadata,compressor,kv_quant_sparse_attn_sharedkv,kv_quant_sparse_attn_sharedkv_metadata,kv-compressor_epilog,hc_post,inplace_partial_rotary_mul,indexer_compress_epilog,moe_gating_top_k\"
          "

      - name: Pack up packages
        run: |
          PACKAGE_NAME="ops-transformer-${{ github.event.release.tag_name }}-torch${{ matrix.torch_version }}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd ../ops-transformer/build_out
          zip -v ${PACKAGE_NAME} ./*.run
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ../ops-transformer/build_out/*.zip

  build-cuntom-ops:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [ aarch64 ]
        npu_hardware: [ 950 ]
        cann_version: [ 9.3.0 ]
        torch_version: [ 2.12.0 ]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-north-4.myhuaweicloud.com/sglang/cann9.3.0-openeuler24.03:20261009-py312

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependency
        run: |
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Debug tag info
        if: github.event_name == 'release'
        run: |
          echo "github.ref = ${{ github.ref }}"
          echo "tag from release event = ${{ github.event.release.tag_name }}"

      - name: Build cann-custom for 950
        if: matrix.npu_hardware == '950'
        run: |
          cd ../
          git clone https://gitcode.com/cann/cann-recipes-infer.git
          cd cann-recipes-infer
          git checkout 35a476c
          env -i PATH=${PATH} bash --login -c "
            cd ops/ascendc/torch_ops_extension
            pip install ninja
            bash build_and_install.sh
          "
          env -i PATH=${PATH} bash --login -c "
            cd ops/ascendc
            bash build.sh -c \"ascend950\"
          "

      - name: Pack up packages
        run: |
          PACKAGE_NAME="custom-ops-${{ github.event.release.tag_name }}-torch${{ matrix.torch_version }}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd ../cann-recipes-infer
          mkdir output
          cp ./ops/ascendc/torch_ops_extension/dist/custom_ops-*.whl ./output
          cp ./ops/ascendc/output/CANN-custom_ops-*.run ./output
          cd output
          zip -v ${PACKAGE_NAME} ./*.run ./*.whl
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ../cann-recipes-infer/output/*.zip
